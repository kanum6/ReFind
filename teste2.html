<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReFind - Sobre Nós</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8ff;
      color: #1a2a4b;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 40px;
      background: #d5e9ff;
    }

    header nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #1a2a4b;
      font-weight: bold;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: white;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #ccc;
    }

    .search-box input {
      border: none;
      outline: none;
      margin-left: 8px;
    }

    .profile-icon {
      width: 35px;
      height: 35px;
      background: #1a2a4b;
      border-radius: 50%;
      margin-left: 20px;
    }

    /* Main section */
    .sobre-nos {
      text-align: center;
      padding: 60px 20px;
      position: relative;
    }

    .sobre-nos h1 {
      font-size: 70px;
      font-weight: 900;
      margin-bottom: 20px;
      color: #2d7ff9;
    }

    .sobre-nos p {
      font-size: 22px;
      max-width: 850px;
      margin: 0 auto;
      line-height: 1.4;
    }

    /* Imagens */
    .img-phone {
      position: absolute;
      top: 20px;
      left: 40px;
      width: 330px;
    }

    .img-woman {
      position: absolute;
      right: 40px;
      top: 220px;
      width: 330px;
    }

    .img-lanterna {
      position: absolute;
      left: 120px;
      top: 420px;
      width: 110px;
    }

    .img-caixa {
      position: absolute;
      left: 350px;
      top: 580px;
      width: 140px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo"><strong>ReF🔍nd</strong></div>

    <nav>
      <a href="#">INÍCIO</a>
      <a href="#">COMO FUNCIONA</a>
      <a href="#">ITENS PERDIDOS</a>
      <a href="#">REGISTRAR ITEM</a>
    </nav>

    <div style="display: flex; align-items: center;">
      <div class="search-box">
        🔍 <input type="text" placeholder="Procurar Itens" />
      </div>
      <div class="profile-icon"></div>
    </div>
  </header>

  <section class="sobre-nos">
    <img src="phone.png" class="img-phone" alt="celular" />
    <img src="woman.png" class="img-woman" alt="mulher" />
    <img src="lanterna.png" class="img-lanterna" alt="lanterna" />
    <img src="caixa.png" class="img-caixa" alt="caixa" />

    <h1>SOBRE NÓS</h1>
    <p>
      Lorem ipsum dolor sit amet. At blanditiis iste quo iusto sunt ut obcaecati commodi.
      Ut autem quas ex eveniet possimus et natus enim. Est consequatur impedit qui
      consequatur corrupti aut accusamus corrupti et veritatis quia.
    </p>
  </section>

</body>
</html>
